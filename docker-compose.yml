name: vtbl-exportmessage-rabbit

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vtbl-mssql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      # Файлы БД: именованный том (bind E:\ ломает MSSQL на Docker Desktop — LSA 0xc0070102).
      - vtbl_mssql_data:/var/opt/mssql
      # Каталог на E:\ — бэкапы и ручной экспорт (виден с хоста).
      - E:/volumes/VTBL.ExportMessage.Rabbit.UI/backup:/var/opt/mssql/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    restart: unless-stopped

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vtbl-mssql-init
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./docker/mssql/init:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Applying 01-create-database.sql..."
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init/01-create-database.sql
        echo "Applying 02-create-tables.sql..."
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -d MSCRM_EXT -b -i /init/02-create-tables.sql
        echo "Applying 03-seed-status-names.sql..."
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -d MSCRM_EXT -b -i /init/03-seed-status-names.sql
        echo "MSCRM_EXT initialized successfully."
    restart: "no"

volumes:
  vtbl_mssql_data:
    name: vtbl-exportmessage-mssql-data
